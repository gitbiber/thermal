<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pico 2 Wärmebildkamera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0; padding: 10px;
    }
    .viewer {
      position: relative;
      width: 96vw;
      max-width: 720px;
      aspect-ratio: 4 / 3;
      border: 2px solid #444;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 24px; height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: ""; position: absolute; background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 3px #000;
    }
    .crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
    .crosshair::after { left: 11px; top: 0; width: 2px; height: 24px; }

    .legend-bar {
      margin-top: 8px;
      width: 96vw;
      max-width: 720px;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .gradient-strip {
      height: 14px;
      width: 100%;
      border-radius: 4px;
      border: 1px solid #444;
      margin-bottom: 6px;
    }
    .stats {
      font-size: 16px;
      display: flex;
      justify-content: space-between;
    }
    .controls {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      width: 96vw;
      max-width: 720px;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    .controls input[type="range"] { flex: 1; accent-color: #ff5722; }
    .btn-row {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 96vw;
      max-width: 720px;
    }
    button {
      flex: 1;
      padding: 14px 12px;
      font-size: 16px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button.secondary {
      background: #2e2e2e;
      border: 1px solid #555;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .status-bar {
      margin-top: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #aaa;
      background: #181818;
      border: 1px solid #333;
      padding: 7px 10px;
      border-radius: 6px;
      width: 96vw;
      max-width: 720px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="viewer">
    <canvas id="thermalCanvas" width="160" height="120"></canvas>
    <div class="crosshair"></div>
  </div>
  
  <div class="legend-bar">
    <div id="gradientStrip" class="gradient-strip"></div>
    <div class="stats">
      <span id="minTemp" style="color:#b388ff;">Min: -- °C</span>
      <span id="centerTemp" style="color:#ffb74d; font-weight:bold;">Mitte: -- °C</span>
      <span id="maxTemp" style="color:#fff59d;">Max: -- °C</span>
    </div>
  </div>

  <div class="controls">
    <span>Glättung:</span>
    <input type="range" id="smoothSlider" min="15" max="95" value="50">
    <span id="smoothLabel">Mittel</span>
  </div>

  <div class="btn-row">
    <button id="paletteBtn" class="secondary">Farbe: Ironbow</button>
    <button id="snapBtn" class="secondary" disabled>Foto speichern</button>
  </div>

  <button id="connectBtn" style="margin-top:10px; width:96vw; max-width:720px;">Kamera verbinden (WebUSB)</button>

  <div id="statusBar" class="status-bar">
    Status: Bereit – Bitte Kamera verbinden
  </div>

  <script>
    const canvas = document.getElementById('thermalCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const rawCanvas = document.createElement('canvas');
    rawCanvas.width = 32;
    rawCanvas.height = 24;
    const rawCtx = rawCanvas.getContext('2d');

    const connectBtn = document.getElementById('connectBtn');
    const paletteBtn = document.getElementById('paletteBtn');
    const snapBtn = document.getElementById('snapBtn');
    const statusBar = document.getElementById('statusBar');
    const gradientStrip = document.getElementById('gradientStrip');
    const smoothSlider = document.getElementById('smoothSlider');
    const smoothLabel = document.getElementById('smoothLabel');

    let device;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 0;

    let smoothedTemps = null;
    let smoothMin = null;
    let smoothMax = null;
    let lastRawMin = 20;
    let lastRawMax = 30;
    let lastCenter = 25;

    const palettes = ['Ironbow', 'Rainbow', 'White-Hot'];
    let paletteIdx = 0;

    function updateLegendStrip() {
      const stops = [];
      for (let i = 0; i <= 20; i++) {
        const [r, g, b] = mapColor(i / 20);
        stops.push(`rgb(${r},${g},${b}) ${i * 5}%`);
      }
      gradientStrip.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
    }

    paletteBtn.addEventListener('click', () => {
      paletteIdx = (paletteIdx + 1) % palettes.length;
      paletteBtn.innerText = `Farbe: ${palettes.at(paletteIdx)}`;
      updateLegendStrip();
    });

    smoothSlider.addEventListener('input', () => {
      const v = Number(smoothSlider.value);
      if (v < 35) smoothLabel.innerText = 'Stark';
      else if (v < 70) smoothLabel.innerText = 'Mittel';
      else smoothLabel.innerText = 'Direkt';
    });

    // Farbpaletten-Berechnung (ratio 0.0 bis 1.0)
    function mapColor(ratio) {
      ratio = Math.max(0, Math.min(1, ratio));
      const mode = palettes.at(paletteIdx);

      if (mode === 'White-Hot') {
        const v = Math.round(ratio * 255);
        return [v, v, v];
      }

      if (mode === 'Rainbow') {
        const r = Math.min(255, Math.max(0, Math.round(255 * (1.5 - Math.abs(4 * ratio - 3)))));
        const g = Math.min(255, Math.max(0, Math.round(255 * (1.5 - Math.abs(4 * ratio - 2)))));
        const b = Math.min(255, Math.max(0, Math.round(255 * (1.5 - Math.abs(4 * ratio - 1)))));
        return [r, g, b];
      }

      // Ironbow (FLIR-Stil: Schwarz -> Violett -> Magenta/Rot -> Orange -> Gelb -> Weiß)
      let r = 0, g = 0, b = 0;
      if (ratio < 0.2) {
        const t = ratio / 0.2;
        r = Math.round(t * 75);
        g = 0;
        b = Math.round(t * 130);
      } else if (ratio < 0.45) {
        const t = (ratio - 0.2) / 0.25;
        r = Math.round(75 + t * 145);
        g = Math.round(t * 20);
        b = Math.round(130 - t * 40);
      } else if (ratio < 0.7) {
        const t = (ratio - 0.45) / 0.25;
        r = Math.round(220 + t * 35);
        g = Math.round(20 + t * 120);
        b = Math.round(90 - t * 90);
      } else if (ratio < 0.9) {
        const t = (ratio - 0.7) / 0.2;
        r = 255;
        g = Math.round(140 + t * 115);
        b = Math.round(t * 80);
      } else {
        const t = (ratio - 0.9) / 0.1;
        r = 255;
        g = 255;
        b = Math.round(80 + t * 175);
      }
      return [r, g, b];
    }

    updateLegendStrip();

    function drawFrame(temps) {
      const alpha = Number(smoothSlider.value) / 100;
      if (!smoothedTemps) smoothedTemps = new Float32Array(temps);

      let rawMin = Infinity, rawMax = -Infinity;
      let validPixels = 0;
      let zeroPixels = 0;

      for (let i = 0; i < 768; i++) {
        const t = temps.at(i);
        if (t === 0) zeroPixels++;
        if (!isNaN(t) && t > -40 && t < 300) {
          validPixels++;
          const prev = smoothedTemps.at(i);
          const next = prev + alpha * (t - prev);
          smoothedTemps.set([next], i);

          if (next < rawMin) rawMin = next;
          if (next > rawMax) rawMax = next;
        }
      }

            lastRawMin = rawMin;
      lastRawMax = rawMax;

      let scaleMin = rawMin;
      let scaleMax = rawMax;
      if (scaleMax - scaleMin < 3.0) {
        const mid = (scaleMax + scaleMin) / 2;
        scaleMin = mid - 1.5;
        scaleMax = mid + 1.5;
      }

      if (smoothMin === null) {
        smoothMin = scaleMin;
        smoothMax = scaleMax;
      } else {
        smoothMin += 0.25 * (scaleMin - smoothMin);
        smoothMax += 0.25 * (scaleMax - smoothMax);
      }

      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      if (validPixels === 768 && zeroPixels === 0) {
        statusBar.style.color = '#81c784';
        statusBar.innerText = `OK | Pixel: ${validPixels}/768 | Nullen: 0 | ${currentFps} FPS`;
      } else {
        statusBar.style.color = '#ffb74d';
        statusBar.innerText = `WARNUNG | Gültig: ${validPixels}/768 | Nullen: ${zeroPixels} | ${currentFps} FPS`;
      }

      lastCenter = smoothedTemps.at(12 * 32 + 16);
      document.getElementById('minTemp').innerText = `Min: ${rawMin.toFixed(1)} °C`;
      document.getElementById('centerTemp').innerText = `Mitte: ${lastCenter.toFixed(1)} °C`;
      document.getElementById('maxTemp').innerText = `Max: ${rawMax.toFixed(1)} °C`;

      const imgData = rawCtx.createImageData(32, 24);
      for (let i = 0; i < 768; i++) {
        const x = 31 - (i % 32);
        const y = Math.floor(i / 32);
        const targetIdx = (y * 32 + x) * 4;
        const ratio = (smoothedTemps.at(i) - smoothMin) / (smoothMax - smoothMin || 1);

        const [r, g, b] = mapColor(ratio);
        imgData.data.set([r, g, b, 255], targetIdx);
      }
      rawCtx.putImageData(imgData, 0, 0);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCanvas, 0, 0, canvas.width, canvas.height);
    }

    // Schnappschuss inkl. Fadenkreuz & Temperatur-Legende exportieren
    snapBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 640;
      exportCanvas.height = 560;
      const eCtx = exportCanvas.getContext('2d');

      eCtx.imageSmoothingEnabled = true;
      eCtx.imageSmoothingQuality = 'high';
      eCtx.drawImage(rawCanvas, 0, 0, 640, 480);

      eCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      eCtx.lineWidth = 2;
      eCtx.beginPath();
      eCtx.moveTo(306, 240); eCtx.lineTo(334, 240);
      eCtx.moveTo(320, 226); eCtx.lineTo(320, 254);
      eCtx.stroke();

      const nowStr = new Date().toLocaleString('de-DE');
      eCtx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      eCtx.fillRect(10, 10, 185, 26);
      eCtx.fillStyle = '#fff';
      eCtx.font = '14px sans-serif';
      eCtx.fillText(nowStr, 18, 28);

      eCtx.fillStyle = '#181818';
      eCtx.fillRect(0, 480, 640, 80);

      const grad = eCtx.createLinearGradient(20, 0, 620, 0);
      for (let i = 0; i <= 20; i++) {
        const [r, g, b] = mapColor(i / 20);
        grad.addColorStop(i / 20, `rgb(${r},${g},${b})`);
      }
      eCtx.fillStyle = grad;
      eCtx.fillRect(20, 494, 600, 20);
      eCtx.strokeStyle = '#555';
      eCtx.strokeRect(20, 494, 600, 20);

      eCtx.font = 'bold 18px sans-serif';
      eCtx.fillStyle = '#b388ff';
      eCtx.textAlign = 'left';
      eCtx.fillText(`Min: ${lastRawMin.toFixed(1)} °C`, 20, 542);

      eCtx.fillStyle = '#ffb74d';
      eCtx.textAlign = 'center';
      eCtx.fillText(`Mitte: ${lastCenter.toFixed(1)} °C`, 320, 542);

      eCtx.fillStyle = '#fff59d';
      eCtx.textAlign = 'right';
      eCtx.fillText(`Max: ${lastRawMax.toFixed(1)} °C`, 620, 542);

      const link = document.createElement('a');
      const fileStamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      link.download = `Waermebild_${fileStamp}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    connectBtn.addEventListener('click', async () => {
      try {
        statusBar.style.color = '#aaa';
        statusBar.innerText = 'Status: Warte auf USB-Auswahl...';

        device = await navigator.usb.requestDevice({ filters: [] });
        await device.open();
        await device.selectConfiguration(1);
        
        const iface = device.configuration.interfaces.find(
          i => i.alternates.at(0).interfaceClass === 255
        );
        await device.claimInterface(iface.interfaceNumber);
        const epIn = iface.alternates.at(0).endpoints.find(
          e => e.direction === 'in'
        ).endpointNumber;

        await device.controlTransferOut({
          requestType: 'class', recipient: 'interface',
          request: 0x22, value: 0x01, index: iface.interfaceNumber
        });

        connectBtn.style.display = 'none';
        snapBtn.disabled = false;
        statusBar.innerText = 'Status: Verbunden – Warte auf erstes Bild...';
        readLoop(epIn);
      } catch (err) {
        statusBar.style.color = '#e57373';
        statusBar.innerText = 'Fehler: ' + err.message;
      }
    });

    async function readLoop(epIn) {
      let buffer = new Uint8Array(0);
      const FRAME_BYTES = 2 + 768 * 4;

      while (device.opened) {
        const result = await device.transferIn(epIn, 4096);
        if (result.data && result.data.byteLength > 0) {
          const chunk = new Uint8Array(result.data.buffer);
          const combined = new Uint8Array(buffer.length + chunk.length);
          combined.set(buffer);
          combined.set(chunk, buffer.length);
          buffer = combined;

          while (buffer.length >= FRAME_BYTES) {
            if (buffer.at(0) === 0xAA && buffer.at(1) === 0x55) {
              const frameBytes = buffer.slice(2, FRAME_BYTES);
              const temps = new Float32Array(frameBytes.buffer);
              drawFrame(temps);
              buffer = buffer.slice(FRAME_BYTES);
            } else {
              buffer = buffer.slice(1);
            }
          }
        }
      }
    }
  </script>
</body>
</html>
