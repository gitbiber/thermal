<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pico 2 Wärmebildkamera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0; padding: 10px;
    }
    .viewer {
      position: relative;
      width: 96vw;
      max-width: 720px;
      aspect-ratio: 4 / 3;
      border: 2px solid #444;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: ""; position: absolute; background: rgba(255, 255, 255, 0.8);
    }
    .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
    .crosshair::after { left: 9px; top: 0; width: 2px; height: 20px; }

    .stats {
      margin-top: 12px;
      font-size: 18px;
      display: flex;
      justify-content: space-around;
      width: 96vw;
      max-width: 720px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
    }
    .status-bar {
      margin-top: 8px;
      font-size: 13px;
      font-family: monospace;
      color: #aaa;
      background: #181818;
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      width: 96vw;
      max-width: 720px;
      text-align: center;
    }
    button {
      margin-top: 14px; padding: 16px 32px; font-size: 18px;
      background: #ff5722; color: white; border: none;
      border-radius: 8px; cursor: pointer; font-weight: bold;
      width: 96vw; max-width: 720px;
    }
  </style>
</head>
<body>

  <div class="viewer">
    <canvas id="thermalCanvas" width="32" height="24"></canvas>
    <div class="crosshair"></div>
  </div>
  
  <div class="stats">
    <span id="minTemp" style="color:#4fc3f7;">Min: -- °C</span>
    <span id="centerTemp" style="color:#ffb74d; font-weight:bold;">Mitte: -- °C</span>
    <span id="maxTemp" style="color:#e57373;">Max: -- °C</span>
  </div>

  <div id="statusBar" class="status-bar">
    Status: Bereit – Bitte Kamera verbinden
  </div>

  <button id="connectBtn">Kamera verbinden (WebUSB)</button>

  <script>
    const canvas = document.getElementById('thermalCanvas');
    const ctx = canvas.getContext('2d');
    const connectBtn = document.getElementById('connectBtn');
    const statusBar = document.getElementById('statusBar');
    let device;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 0;

    function tempToColor(val, min, max) {
      let ratio = (val - min) / (max - min || 1);
      ratio = Math.max(0, Math.min(1, ratio));
      let r = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 3))));
      let g = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 2))));
      let b = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 1))));
      return [r, g, b];
    }

    function drawFrame(temps) {
      let min = Infinity, max = -Infinity;
      let validPixels = 0;
      let zeroPixels = 0;

      for (let i = 0; i < temps.length; i++) {
        let t = temps.at(i);
        if (t === 0) zeroPixels++;
        if (!isNaN(t) && t > -40 && t < 300) {
          validPixels++;
          if (t < min) min = t;
          if (t > max) max = t;
        }
      }

      // FPS berechnen
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      // Statuszeile aktualisieren
      if (validPixels === 768 && zeroPixels === 0) {
        statusBar.style.color = '#81c784'; // Grün = Alles perfekt
        statusBar.innerText = `OK | Pixel: ${validPixels}/768 | Nullen: 0 | ${currentFps} FPS`;
      } else {
        statusBar.style.color = '#ffb74d'; // Orange = Hinweis
        statusBar.innerText = `WARNUNG | Gültig: ${validPixels}/768 | Nullen: ${zeroPixels} | ${currentFps} FPS`;
      }

      const centerVal = temps.at(12 * 32 + 16);
      document.getElementById('minTemp').innerText = `Min: ${min.toFixed(1)} °C`;
      document.getElementById('centerTemp').innerText = `Mitte: ${centerVal.toFixed(1)} °C`;
      document.getElementById('maxTemp').innerText = `Max: ${max.toFixed(1)} °C`;

      const imgData = ctx.createImageData(32, 24);
      for (let i = 0; i < 768; i++) {
        let x = 31 - (i % 32);
        let y = Math.floor(i / 32);
        let targetIdx = (y * 32 + x) * 4;

        let [r, g, b] = tempToColor(temps.at(i), min, max);
        imgData.data[targetIdx] = r;
        imgData.data[targetIdx + 1] = g;
        imgData.data[targetIdx + 2] = b;
        imgData.data[targetIdx + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    connectBtn.addEventListener('click', async () => {
      try {
        statusBar.style.color = '#aaa';
        statusBar.innerText = 'Status: Warte auf USB-Auswahl...';

        device = await navigator.usb.requestDevice({ filters: [] });
        await device.open();
        await device.selectConfiguration(1);
        
        const iface = device.configuration.interfaces.find(
          i => i.alternates.at(0).interfaceClass === 255
        );
        await device.claimInterface(iface.interfaceNumber);
        const epIn = iface.alternates.at(0).endpoints.find(
          e => e.direction === 'in'
        ).endpointNumber;

        await device.controlTransferOut({
          requestType: 'class', recipient: 'interface',
          request: 0x22, value: 0x01, index: iface.interfaceNumber
        });

        connectBtn.style.display = 'none';
        statusBar.innerText = 'Status: Verbunden – Warte auf erstes Bild...';
        readLoop(epIn);
      } catch (err) {
        statusBar.style.color = '#e57373';
        statusBar.innerText = 'Fehler: ' + err.message;
      }
    });

    async function readLoop(epIn) {
      let buffer = new Uint8Array(0);
      const FRAME_BYTES = 2 + 768 * 4; // 3074 Bytes pro Bild

      while (device.opened) {
        const result = await device.transferIn(epIn, 4096);
        if (result.data && result.data.byteLength > 0) {
          const chunk = new Uint8Array(result.data.buffer);
          const combined = new Uint8Array(buffer.length + chunk.length);
          combined.set(buffer);
          combined.set(chunk, buffer.length);
          buffer = combined;

          while (buffer.length >= FRAME_BYTES) {
            if (buffer.at(0) === 0xAA && buffer.at(1) === 0x55) {
              const frameBytes = buffer.slice(2, FRAME_BYTES);
              const temps = new Float32Array(frameBytes.buffer);
              drawFrame(temps);
              buffer = buffer.slice(FRAME_BYTES);
            } else {
              buffer = buffer.slice(1);
            }
          }
        }
      }
    }
  </script>
</body>
</html>
