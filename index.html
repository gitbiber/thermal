<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pico 2 Wärmebildkamera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0; padding: 10px;
    }
    .viewer {
      position: relative;
      width: 96vw;
      max-width: 720px;
      aspect-ratio: 4 / 3;
      border: 2px solid #444;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: ""; position: absolute; background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px #000;
    }
    .crosshair::before { top: 10px; left: 0; width: 22px; height: 2px; }
    .crosshair::after { left: 10px; top: 0; width: 2px; height: 22px; }

    .stats {
      margin-top: 12px;
      font-size: 18px;
      display: flex;
      justify-content: space-around;
      width: 96vw;
      max-width: 720px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
    }
    .controls {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      width: 96vw;
      max-width: 720px;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    .controls input[type="range"] { flex: 1; accent-color: #ff5722; }
    .status-bar {
      margin-top: 8px;
      font-size: 13px;
      font-family: monospace;
      color: #aaa;
      background: #181818;
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      width: 96vw;
      max-width: 720px;
      text-align: center;
    }
    button {
      margin-top: 12px; padding: 16px 32px; font-size: 18px;
      background: #ff5722; color: white; border: none;
      border-radius: 8px; cursor: pointer; font-weight: bold;
      width: 96vw; max-width: 720px;
    }
  </style>
</head>
<body>

  <div class="viewer">
    <canvas id="thermalCanvas" width="160" height="120"></canvas>
    <div class="crosshair"></div>
  </div>
  
  <div class="stats">
    <span id="minTemp" style="color:#4fc3f7;">Min: -- °C</span>
    <span id="centerTemp" style="color:#ffb74d; font-weight:bold;">Mitte: -- °C</span>
    <span id="maxTemp" style="color:#e57373;">Max: -- °C</span>
  </div>

  <div class="controls">
    <span>Bildglättung:</span>
    <input type="range" id="smoothSlider" min="10" max="90" value="45">
    <span id="smoothLabel">Mittel</span>
  </div>

  <div id="statusBar" class="status-bar">
    Status: Bereit – Bitte Kamera verbinden
  </div>

  <button id="connectBtn">Kamera verbinden (WebUSB)</button>

  <script>
    const canvas = document.getElementById('thermalCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Unsichtbares Roh-Canvas (32x24) für saubere Hochskalierung
    const rawCanvas = document.createElement('canvas');
    rawCanvas.width = 32;
    rawCanvas.height = 24;
    const rawCtx = rawCanvas.getContext('2d');

    const connectBtn = document.getElementById('connectBtn');
    const statusBar = document.getElementById('statusBar');
    const smoothSlider = document.getElementById('smoothSlider');
    const smoothLabel = document.getElementById('smoothLabel');

    let device;
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let currentFps = 0;

    // Puffer für zeitliche Glättung
    let smoothedTemps = null;
    let smoothMin = null;
    let smoothMax = null;

    smoothSlider.addEventListener('input', () => {
      const v = Number(smoothSlider.value);
      if (v < 30) smoothLabel.innerText = 'Stark';
      else if (v < 65) smoothLabel.innerText = 'Mittel';
      else smoothLabel.innerText = 'Direkt';
    });

    function tempToColor(val, min, max) {
      let ratio = (val - min) / (max - min || 1);
      ratio = Math.max(0, Math.min(1, ratio));
      let r = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 3))));
      let g = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 2))));
      let b = Math.min(255, Math.max(0, 255 * (1.5 - Math.abs(4 * ratio - 1))));
      return [r, g, b];
    }

    function drawFrame(temps) {
      const alpha = Number(smoothSlider.value) / 100; // Mischfaktor neues Bild

      if (!smoothedTemps) {
        smoothedTemps = new Float32Array(temps);
      }

      let rawMin = Infinity, rawMax = -Infinity;
      let validPixels = 0;
      let zeroPixels = 0;

      for (let i = 0; i < 768; i++) {
        let t = temps.at(i);
        if (t === 0) zeroPixels++;
        if (!isNaN(t) && t > -40 && t < 300) {
          validPixels++;
          // Zeitliche Glättung pro Pixel gegen Schachbrett-Flimmern
          const prev = smoothedTemps.at(i);
          const next = prev + alpha * (t - prev);
          smoothedTemps.set([next], i);

          if (next < rawMin) rawMin = next;
          if (next > rawMax) rawMax = next;
        }
      }

      // Mindest-Kontrastfenster von 3.5 °C erzwingen (verhindert Farb-Pumpen)
      if (rawMax - rawMin < 3.5) {
        const mid = (rawMax + rawMin) / 2;
        rawMin = mid - 1.75;
        rawMax = mid + 1.75;
      }

      // Farbskala selbst weich nachführen
      if (smoothMin === null) {
        smoothMin = rawMin;
        smoothMax = rawMax;
      } else {
        smoothMin += 0.25 * (rawMin - smoothMin);
        smoothMax += 0.25 * (rawMax - smoothMax);
      }

      // FPS berechnen
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsTime = now;
      }

      if (validPixels === 768 && zeroPixels === 0) {
        statusBar.style.color = '#81c784';
        statusBar.innerText = `OK | Pixel: ${validPixels}/768 | Nullen: 0 | ${currentFps} FPS`;
      } else {
        statusBar.style.color = '#ffb74d';
        statusBar.innerText = `WARNUNG | Gültig: ${validPixels}/768 | Nullen: ${zeroPixels} | ${currentFps} FPS`;
      }

      const centerVal = smoothedTemps.at(12 * 32 + 16);
      document.getElementById('minTemp').innerText = `Min: ${rawMin.toFixed(1)} °C`;
      document.getElementById('centerTemp').innerText = `Mitte: ${centerVal.toFixed(1)} °C`;
      document.getElementById('maxTemp').innerText = `Max: ${rawMax.toFixed(1)} °C`;

      const imgData = rawCtx.createImageData(32, 24);
      for (let i = 0; i < 768; i++) {
        let x = 31 - (i % 32);
        let y = Math.floor(i / 32);
        let targetIdx = (y * 32 + x) * 4;

        let [r, g, b] = tempToColor(smoothedTemps.at(i), smoothMin, smoothMax);
        imgData.data[targetIdx] = r;
        imgData.data[targetIdx + 1] = g;
        imgData.data[targetIdx + 2] = b;
        imgData.data[targetIdx + 3] = 255;
      }
      rawCtx.putImageData(imgData, 0, 0);

      // Weich hochskaliert auf das Haupt-Canvas zeichnen
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCanvas, 0, 0, canvas.width, canvas.height);
    }

    connectBtn.addEventListener('click', async () => {
      try {
        statusBar.style.color = '#aaa';
        statusBar.innerText = 'Status: Warte auf USB-Auswahl...';

        device = await navigator.usb.requestDevice({ filters: [] });
        await device.open();
        await device.selectConfiguration(1);
        
        const iface = device.configuration.interfaces.find(
          i => i.alternates.at(0).interfaceClass === 255
        );
        await device.claimInterface(iface.interfaceNumber);
        const epIn = iface.alternates.at(0).endpoints.find(
          e => e.direction === 'in'
        ).endpointNumber;

        await device.controlTransferOut({
          requestType: 'class', recipient: 'interface',
          request: 0x22, value: 0x01, index: iface.interfaceNumber
        });

        connectBtn.style.display = 'none';
        statusBar.innerText = 'Status: Verbunden – Warte auf erstes Bild...';
        readLoop(epIn);
      } catch (err) {
        statusBar.style.color = '#e57373';
        statusBar.innerText = 'Fehler: ' + err.message;
      }
    });

    async function readLoop(epIn) {
      let buffer = new Uint8Array(0);
      const FRAME_BYTES = 2 + 768 * 4;

      while (device.opened) {
        const result = await device.transferIn(epIn, 4096);
        if (result.data && result.data.byteLength > 0) {
          const chunk = new Uint8Array(result.data.buffer);
          const combined = new Uint8Array(buffer.length + chunk.length);
          combined.set(buffer);
          combined.set(chunk, buffer.length);
          buffer = combined;

          while (buffer.length >= FRAME_BYTES) {
            if (buffer.at(0) === 0xAA && buffer.at(1) === 0x55) {
              const frameBytes = buffer.slice(2, FRAME_BYTES);
              const temps = new Float32Array(frameBytes.buffer);
              drawFrame(temps);
              buffer = buffer.slice(FRAME_BYTES);
            } else {
              buffer = buffer.slice(1);
            }
          }
        }
      }
    }
  </script>
</body>
</html>
